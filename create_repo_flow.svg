<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="620" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="52" fill="#f8f8f6"/>
  <rect x="0" y="51" width="900" height="1" fill="#e0dfd8"/>
  <text x="28" y="32" font-size="16" font-weight="600" fill="#1a1a18">Create Repository — Self-Service Flow</text>
  <rect x="532" y="14" width="148" height="22" rx="11" fill="#eaf3de"/>
  <text x="606" y="29" font-size="11" font-weight="600" fill="#3b6d11" text-anchor="middle">Airflow → Harness Pipeline</text>
  <rect x="688" y="14" width="120" height="22" rx="11" fill="#faeeda"/>
  <text x="748" y="29" font-size="11" font-weight="600" fill="#854f0b" text-anchor="middle">Completes in minutes</text>

  <!-- ─── LEFT PANEL: IDP Form ─── -->
  <rect x="28" y="70" width="230" height="400" rx="10" fill="#ffffff" stroke="#e0dfd8" stroke-width="0.8"/>
  <!-- Form header -->
  <rect x="28" y="70" width="230" height="42" rx="10" fill="#e6f1fb"/>
  <rect x="28" y="92" width="230" height="20" fill="#e6f1fb"/>
  <rect x="28" y="111" width="230" height="1" fill="#b5d4f4"/>
  <text x="42" y="89" font-size="12" font-weight="600" fill="#0c447c">Developer Request</text>
  <text x="42" y="106" font-size="10" fill="#185fa5">IDP Self-Service Portal · 1 screen</text>

  <!-- Form fields -->
  <text x="42" y="132" font-size="10" fill="#888780">SYSID</text>
  <rect x="42" y="138" width="202" height="26" rx="5" fill="#f1efe8" stroke="#d3d1c7" stroke-width="0.6"/>
  <text x="52" y="155" font-size="11" font-weight="500" fill="#2c2c2a">06435 — Hoover</text>

  <text x="42" y="178" font-size="10" fill="#888780">Repository type</text>
  <rect x="42" y="184" width="202" height="26" rx="5" fill="#f1efe8" stroke="#d3d1c7" stroke-width="0.6"/>
  <text x="52" y="201" font-size="11" font-weight="500" fill="#2c2c2a">Application</text>

  <text x="42" y="224" font-size="10" fill="#888780">Repository name</text>
  <rect x="42" y="230" width="202" height="26" rx="5" fill="#f1efe8" stroke="#d3d1c7" stroke-width="0.6"/>
  <text x="52" y="247" font-size="11" fill="#b4b2a9">e.g. hoover-payments-api</text>

  <text x="42" y="270" font-size="10" fill="#888780">Description</text>
  <rect x="42" y="276" width="202" height="26" rx="5" fill="#f1efe8" stroke="#d3d1c7" stroke-width="0.6"/>
  <text x="52" y="293" font-size="11" fill="#b4b2a9">Short description…</text>

  <text x="42" y="316" font-size="10" fill="#888780">Tech stack</text>
  <rect x="42" y="322" width="202" height="26" rx="5" fill="#f1efe8" stroke="#d3d1c7" stroke-width="0.6"/>
  <text x="52" y="339" font-size="11" font-weight="500" fill="#2c2c2a">Java / Node.js</text>

  <!-- divider -->
  <line x1="42" y1="360" x2="244" y2="360" stroke="#e0dfd8" stroke-width="0.8"/>

  <!-- Conditional note -->
  <rect x="42" y="368" width="202" height="40" rx="5" fill="#faeeda"/>
  <text x="52" y="384" font-size="10" fill="#633806">If AD Groups don't exist —</text>
  <text x="52" y="398" font-size="10" fill="#633806">enter Developer &amp; Reviewer members</text>

  <!-- Submit button -->
  <rect x="42" y="418" width="202" height="34" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.7"/>
  <text x="143" y="440" font-size="12" font-weight="600" fill="#0c447c" text-anchor="middle">Submit Request →</text>

  <!-- ─── ARROW from form to pipeline ─── -->
  <line x1="258" y1="270" x2="284" y2="270" stroke="#b4b2a9" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#e24b4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ─── RIGHT PANEL: Pipeline ─── -->
  <!-- Header -->
  <text x="295" y="84" font-size="10" font-weight="600" fill="#888780" letter-spacing="0.5">HARNESS PIPELINE — AUTOMATED EXECUTION</text>
  <rect x="730" y="68" width="142" height="22" rx="11" fill="#eaf3de"/>
  <text x="801" y="83" font-size="11" font-weight="600" fill="#3b6d11" text-anchor="middle">~ 3–5 min end-to-end</text>

  <!-- Connector line down stages -->
  <line x1="306" y1="104" x2="306" y2="468" stroke="#d3d1c7" stroke-width="1.2" stroke-dasharray="2 3"/>

  <!-- Stage 1 -->
  <rect x="295" y="98" width="570" height="52" rx="8" fill="#ffffff" stroke="#e0dfd8" stroke-width="0.8"/>
  <circle cx="306" cy="124" r="5" fill="#378add"/>
  <text x="320" y="120" font-size="12" font-weight="600" fill="#1a1a18">Stage 1 — Validate Request</text>
  <text x="320" y="136" font-size="11" fill="#5f5e5a">Uniqueness check · field validation · resolve repo name from SYSID</text>
  <rect x="798" y="108" width="56" height="18" rx="3" fill="#e6f1fb"/>
  <text x="826" y="120" font-size="10" font-weight="600" fill="#185fa5" text-anchor="middle">Validation</text>

  <!-- Stage 2 -->
  <rect x="295" y="162" width="570" height="52" rx="8" fill="#ffffff" stroke="#e0dfd8" stroke-width="0.8"/>
  <circle cx="306" cy="188" r="5" fill="#7f77dd"/>
  <text x="320" y="184" font-size="12" font-weight="600" fill="#1a1a18">Stage 2 — Validate AD Groups</text>
  <text x="320" y="200" font-size="11" fill="#5f5e5a">Check Azure AD · auto-create groups if missing · wait for propagation</text>
  <rect x="804" y="172" width="50" height="18" rx="3" fill="#eeedfe"/>
  <text x="829" y="184" font-size="10" font-weight="600" fill="#534ab7" text-anchor="middle">Identity</text>

  <!-- Stage 3 -->
  <rect x="295" y="226" width="570" height="52" rx="8" fill="#ffffff" stroke="#e0dfd8" stroke-width="0.8"/>
  <circle cx="306" cy="252" r="5" fill="#1d9e75"/>
  <text x="320" y="248" font-size="12" font-weight="600" fill="#1a1a18">Stage 3 — Create Repo in GitHub</text>
  <text x="320" y="264" font-size="11" fill="#5f5e5a">Create repo · inject tech stack templates · add metadata &amp; topics · register webhook</text>
  <rect x="790" y="236" width="66" height="18" rx="3" fill="#e1f5ee"/>
  <text x="823" y="248" font-size="10" font-weight="600" fill="#0f6e56" text-anchor="middle">Provisioning</text>

  <!-- Stage 4 -->
  <rect x="295" y="290" width="570" height="52" rx="8" fill="#ffffff" stroke="#e0dfd8" stroke-width="0.8"/>
  <circle cx="306" cy="316" r="5" fill="#1d9e75"/>
  <text x="320" y="312" font-size="12" font-weight="600" fill="#1a1a18">Stage 4 — Add Repo Permissions</text>
  <text x="320" y="328" font-size="11" fill="#5f5e5a">Attach dso-sysid-developer &amp; dso-sysid-reviewer teams to repo</text>
  <rect x="812" y="300" width="42" height="18" rx="3" fill="#e1f5ee"/>
  <text x="833" y="312" font-size="10" font-weight="600" fill="#0f6e56" text-anchor="middle">Access</text>

  <!-- Stage 5 -->
  <rect x="295" y="354" width="570" height="52" rx="8" fill="#ffffff" stroke="#e0dfd8" stroke-width="0.8"/>
  <circle cx="306" cy="380" r="5" fill="#ba7517"/>
  <text x="320" y="376" font-size="12" font-weight="600" fill="#1a1a18">Stage 5 — Create Jenkins Folder</text>
  <text x="320" y="392" font-size="11" fill="#5f5e5a">Provision Jenkins folder · CI pipeline ready for the new repo</text>
  <rect x="826" y="364" width="28" height="18" rx="3" fill="#faeeda"/>
  <text x="840" y="376" font-size="10" font-weight="600" fill="#854f0b" text-anchor="middle">CI</text>

  <!-- Stage 6 -->
  <rect x="295" y="418" width="570" height="52" rx="8" fill="#ffffff" stroke="#e0dfd8" stroke-width="0.8"/>
  <circle cx="306" cy="444" r="5" fill="#639922"/>
  <text x="320" y="440" font-size="12" font-weight="600" fill="#1a1a18">Stage 6 — Success Notification</text>
  <text x="320" y="456" font-size="11" fill="#5f5e5a">Requester notified · repo live · teams assigned · CI ready</text>
  <rect x="824" y="428" width="30" height="18" rx="3" fill="#eaf3de"/>
  <text x="839" y="440" font-size="10" font-weight="600" fill="#3b6d11" text-anchor="middle">Done</text>

  <!-- ─── ERROR PATH ─── -->
  <rect x="295" y="484" width="570" height="60" rx="8" fill="#ffffff" stroke="#f09595" stroke-width="0.8" stroke-dasharray="4 3"/>
  <circle cx="320" cy="514" r="12" fill="#fcebeb" stroke="#f7c1c1" stroke-width="0.8"/>
  <text x="320" y="519" font-size="12" font-weight="700" fill="#791f1f" text-anchor="middle">!</text>
  <text x="342" y="505" font-size="12" font-weight="600" fill="#791f1f">On any stage failure</text>
  <text x="342" y="520" font-size="11" fill="#5f5e5a">Self-service team notified immediately with failed stage and reason.</text>
  <text x="342" y="534" font-size="11" fill="#5f5e5a">Pipeline re-triggers from the failed stage — no restart from scratch.</text>
  <rect x="700" y="497" width="154" height="20" rx="4" fill="#e6f1fb"/>
  <text x="777" y="511" font-size="10" font-weight="600" fill="#185fa5" text-anchor="middle">↩ Resume from failed stage</text>

  <!-- ─── SUCCESS BAR ─── -->
  <rect x="28" y="558" width="844" height="44" rx="8" fill="#eaf3de" stroke="#c0dd97" stroke-width="0.8"/>
  <circle cx="54" cy="580" r="11" fill="#639922"/>
  <text x="54" y="584" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="74" y="576" font-size="12" font-weight="600" fill="#3b6d11">Zero manual steps · APIs reused across all stages</text>
  <text x="74" y="592" font-size="11" fill="#3b6d11">Developer self-serves · platform team stays in control</text>

</svg>
